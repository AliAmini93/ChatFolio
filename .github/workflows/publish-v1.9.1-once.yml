name: Publish ChatFolio v1.9.1 (one-time, approved)

on:
  push:
    branches:
      - publish/v1.9.1-once
    paths:
      - .github/workflows/publish-v1.9.1-once.yml

permissions:
  contents: write

concurrency:
  group: publish-chatfolio-v1.9.1
  cancel-in-progress: false

jobs:
  publish:
    name: Reverify candidate and publish approved stable patch
    if: ${{ github.repository == 'AliAmini93/ChatFolio' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPROVED_SOURCE: aa2e30bcc8eecaf0c62a82d27a0b22b61d2d64b4
      TESTED_CANDIDATE: 4a16eeb4a78ba2372ed850d2ec27620c21ecc31d
      EXPECTED_ZIP_SHA256: 6f80980e7f32ab650965bc14f4d4c23b3e929f3806a4fdb2941e3bbefc5bccf2
      EXPECTED_ZIP_SIZE: '116068'
      ZIP_NAME: chatfolio-1.9.1-chrome.zip

    steps:
      - name: Checkout exact approved source, not release workflow branch
        uses: actions/checkout@v4
        with:
          ref: aa2e30bcc8eecaf0c62a82d27a0b22b61d2d64b4
          fetch-depth: 0
          persist-credentials: true

      - name: Check source identity, documentation-only post-QA changes and tag absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SOURCE"
          test "$(node -p "require('./manifest.json').version")" = "1.9.1"
          test "$(node -p "require('./package.json').version")" = "1.9.1"
          git cat-file -e "$TESTED_CANDIDATE^{commit}"
          git diff --quiet "$TESTED_CANDIDATE" "$APPROVED_SOURCE" -- . \
            ':(exclude)CHANGELOG.md' ':(exclude)RELEASE_NOTES_1.9.1.md'
          if git ls-remote --tags origin refs/tags/v1.9.1 | grep -q .; then
            echo "Tag v1.9.1 already exists; refusing to overwrite or republish."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install regression dependencies and Chromium
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Validate bundle and source
        run: |
          npm run bundle:check
          npm run check

      - name: Rerun all Node and real-Chromium browser fixture tests
        run: npm test

      - name: Rebuild and verify byte-identical ZIP, including integrity gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          python scripts/release_gate.py
          test "$(stat -c %s "dist/$ZIP_NAME")" -eq "$EXPECTED_ZIP_SIZE"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "dist/$ZIP_NAME" | sha256sum -c -

      - name: Create immutable annotated tag only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SOURCE"
          if git ls-remote --tags origin refs/tags/v1.9.1 | grep -q .; then
            echo "Tag already exists; aborting without modifying it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.9.1 "$APPROVED_SOURCE" -m "ChatFolio v1.9.1 stable patch - delayed preview recovery, known limitations disclosed"
          git push origin refs/tags/v1.9.1

      - name: Publish approved ZIP and final public release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.9.1 "dist/$ZIP_NAME" \
            --verify-tag \
            --title "ChatFolio v1.9.1" \
            --notes-file RELEASE_NOTES_1.9.1.md \
            --latest
          test "$(gh release view v1.9.1 --json tagName --jq .tagName)" = "v1.9.1"
          echo "Published ChatFolio v1.9.1 from $APPROVED_SOURCE; ZIP SHA256 $EXPECTED_ZIP_SHA256" >> "$GITHUB_STEP_SUMMARY"
