name: Manual RC Preview (no publication)

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Proposed tag (vMAJOR.MINOR.PATCH-rc.N); NOT created by this workflow'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character main commit SHA approved for preview'
        required: true
        type: string
      qa_attested:
        description: 'I completed and checked all required private local real-provider QA reports'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rc-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and package unpublished RC preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Check main ref, approved commit, version, and human QA attestation
        env:
          RC_TAG: ${{ inputs.candidate_tag }}
          APPROVED_SHA: ${{ inputs.expected_sha }}
          QA_ATTESTED: ${{ inputs.qa_attested }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "RC preview must run on main."
            exit 1
          fi
          if [ "$QA_ATTESTED" != "true" ]; then
            echo "Private live-provider QA has not been approved."
            exit 1
          fi
          python scripts/rc_readiness.py \
            --candidate-tag "$RC_TAG" \
            --expected-sha "$APPROVED_SHA" \
            --qa-attested true
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Check classic MV3 bundle and code
        run: |
          npm run bundle:check
          npm run check
      - name: Run all unit and Chromium regressions
        run: npm test
      - name: Build deterministic extension archive
        run: npm run build
      - name: Enforce byte-identical artifact integrity
        run: python scripts/release_gate.py
      - name: Upload *unpublished* preview for authorized reviewers
        uses: actions/upload-artifact@v4
        with:
          name: chatfolio-rc-preview-unpublished
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Explain preview-only result
        run: |
          echo "### ChatFolio unpublished RC preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified commit: `$GITHUB_SHA`." >> "$GITHUB_STEP_SUMMARY"
          echo "This run created **no Git tag, GitHub Release or store upload**." >> "$GITHUB_STEP_SUMMARY"
          echo "Human QA attestation was supplied; private reports were not uploaded." >> "$GITHUB_STEP_SUMMARY"
