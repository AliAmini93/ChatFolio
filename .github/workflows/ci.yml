name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate / Browser Regression / Package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python regression dependencies and Chromium
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Syntax and manifest validation
        run: npm run check
      - name: Existing regression suite (synthetic fixtures)
        run: npm test
      - name: Build and verify Chrome ZIP
        run: npm run build
      - name: Release safety gate (no publishing)
        run: python scripts/release_gate.py
      - name: Upload tested ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatfolio-checked-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
