<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatFolio Print</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #f5f7f8; color: #19221f; }
    body.ready { background: #fff; }
    #statusWrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 2; background: #f5f7f8; }
    .card { width: min(520px, 92vw); background: #fff; border: 1px solid #d9e1de; border-radius: 18px; padding: 24px; box-shadow: 0 18px 50px rgba(28,45,39,.10); text-align: center; }
    .mark { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 14px; display: grid; place-items: center; background: #e4f3ee; color: #176b56; font-weight: 800; font-size: 22px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0; color: #60706a; line-height: 1.5; }
    #printAgain { margin-top: 16px; border: 0; border-radius: 10px; padding: 10px 16px; background: #237b65; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    #printAgain[hidden] { display: none; }
    #preview { width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #fff; }
    body.ready #preview { visibility: visible; }
    body.ready #statusWrap { display: none; }
    @media (prefers-color-scheme: dark) {
      html, body, #statusWrap { background: #171b1a; color: #edf4f1; }
      .card { background: #202725; border-color: #34413d; box-shadow: none; }
      p { color: #aebdb8; }
      .mark { background: #183c32; color: #8dd5bd; }
    }
  </style>
</head>
<body>
  <div id="statusWrap">
    <div class="card">
      <div class="mark">CF</div>
      <h1 id="statusTitle">Preparing your print view</h1>
      <p id="statusText">ChatFolio is transferring the conversation from the source tab.</p>
      <button id="printAgain" type="button" hidden>Print again</button>
    </div>
  </div>
  <iframe id="preview" title="ChatFolio printable conversation"></iframe>
  <script src="print.js"></script>
</body>
</html>
