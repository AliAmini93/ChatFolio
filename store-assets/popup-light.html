<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
  --bg: #f6f8f7;
  --surface: rgba(255, 255, 255, 0.92);
  --surface-strong: #ffffff;
  --surface-soft: #edf3f1;
  --text: #13201d;
  --muted: #66736f;
  --border: rgba(18, 51, 44, 0.11);
  --accent: #157a68;
  --accent-2: #2d9d84;
  --accent-soft: rgba(21, 122, 104, 0.11);
  --danger: #c0362c;
  --danger-soft: rgba(192, 54, 44, 0.11);
  --shadow: 0 18px 45px rgba(22, 45, 39, 0.10), 0 2px 10px rgba(22, 45, 39, 0.05);
  --subtle-shadow: 0 5px 18px rgba(22, 45, 39, 0.07);
}

html[data-theme="graphite"] {
  color-scheme: dark;
  --bg: #2f3436;
  --surface: rgba(63, 69, 71, 0.96);
  --surface-strong: #464c4e;
  --surface-soft: #383e40;
  --text: #f1f4f3;
  --muted: #b9c1bf;
  --border: rgba(255, 255, 255, 0.09);
  --accent: #63c8ad;
  --accent-2: #86ddc5;
  --accent-soft: rgba(99, 200, 173, 0.14);
  --danger: #ff8177;
  --danger-soft: rgba(255, 129, 119, 0.13);
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.25), 0 2px 10px rgba(0, 0, 0, 0.18);
  --subtle-shadow: 0 5px 18px rgba(0, 0, 0, 0.17);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111716;
  --surface: rgba(26, 34, 32, 0.96);
  --surface-strong: #1f2927;
  --surface-soft: #18211f;
  --text: #f4f8f7;
  --muted: #9eaaa7;
  --border: rgba(255, 255, 255, 0.08);
  --accent: #69d2b5;
  --accent-2: #8fe2ca;
  --accent-soft: rgba(105, 210, 181, 0.13);
  --danger: #ff8278;
  --danger-soft: rgba(255, 130, 120, 0.12);
  --shadow: 0 22px 55px rgba(0, 0, 0, 0.38), 0 2px 12px rgba(0, 0, 0, 0.28);
  --subtle-shadow: 0 5px 18px rgba(0, 0, 0, 0.24);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 390px;
  max-width: 390px;
  background:
    radial-gradient(circle at 14% -8%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 34%),
    var(--bg);
  color: var(--text);
}

button, select, input { font: inherit; }
button { color: inherit; }

.app-shell { padding: 17px; }

.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 18%, var(--surface-strong)), var(--surface-strong));
  border: 1px solid var(--border);
  box-shadow: var(--subtle-shadow);
}

.brand-mark img { width: 36px; height: 36px; border-radius: 9px; }
.brand-copy { min-width: 0; flex: 1; }
.brand-line { display: flex; align-items: center; gap: 8px; }

h1 { margin: 0; font-size: 21px; letter-spacing: -0.035em; line-height: 1.05; }
.brand-copy p { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; }
.version-pill {
  padding: 3px 7px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 750;
}

.platform-card,
.panel,
.progress-card,
.status-card {
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--subtle-shadow);
  backdrop-filter: blur(14px);
}

.platform-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 13px;
  border-radius: 14px;
  margin-bottom: 11px;
}

.platform-card strong { display: block; margin-top: 2px; font-size: 13px; }
.eyebrow { display: block; color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 800; }

.platform-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 25px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}
.platform-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 11%, transparent);
}
.platform-badge.unsupported { color: var(--danger); background: var(--danger-soft); }

body[data-platform="claude"] .platform-badge { color: #c86f49; background: color-mix(in srgb, #c86f49 13%, transparent); }
body[data-platform="gemini"] .platform-badge { color: #527bd3; background: color-mix(in srgb, #527bd3 13%, transparent); }
body[data-platform="chatgpt"] .platform-badge { color: var(--accent); background: var(--accent-soft); }

.panel { border-radius: 16px; padding: 13px; margin-bottom: 11px; }
.section-heading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-heading h2 { margin: 2px 0 0; font-size: 13.5px; letter-spacing: -0.015em; }
.compact-heading { margin-bottom: 7px; }

.theme-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.theme-choice {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  border-radius: 11px;
  padding: 8px 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 750;
  transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
}
.theme-choice:hover { transform: translateY(-1px); }
.theme-choice[aria-pressed="true"] {
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 52%, var(--border));
  background: var(--accent-soft);
}
.theme-swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.16); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.light-swatch { background: #f7faf9; }
.graphite-swatch { background: #454b4d; }
.dark-swatch { background: #111716; }

.select-row,
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.select-row { padding: 8px 0 11px; border-bottom: 1px solid var(--border); }
.select-row strong, .toggle-row strong { display: block; font-size: 11.5px; }
.select-row small, .toggle-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 9.5px; line-height: 1.28; }

select {
  min-width: 116px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 27px 7px 9px;
  background: var(--surface-strong);
  color: var(--text);
  outline: none;
}
select:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }

.toggle-stack { padding-top: 3px; }
.toggle-row { position: relative; padding: 8px 0; cursor: pointer; }
.toggle-input { position: absolute; opacity: 0; pointer-events: none; }
.toggle-ui {
  position: relative;
  flex: 0 0 auto;
  width: 36px;
  height: 21px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--muted) 25%, transparent);
  border: 1px solid var(--border);
  transition: background 150ms ease;
}
.toggle-ui::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--surface-strong);
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
  transition: transform 150ms ease;
}
.toggle-input:checked + .toggle-ui { background: var(--accent); }
.toggle-input:checked + .toggle-ui::after { transform: translateX(15px); }
.toggle-input:focus-visible + .toggle-ui { outline: 2px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }
.toggle-input:disabled + .toggle-ui { opacity: .45; }

.action-row { display: flex; gap: 8px; margin: 4px 0 11px; }
.primary-button,
.stop-button {
  border: 0;
  border-radius: 13px;
  min-height: 43px;
  padding: 10px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
}
.primary-button { flex: 1; color: #fff; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 84%, var(--accent))); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 24%, transparent); }
.primary-button:hover:not(:disabled), .stop-button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.03); }
.primary-button:disabled, .stop-button:disabled { opacity: .52; cursor: default; transform: none; }
.stop-button { width: 116px; color: #fff; background: linear-gradient(135deg, #c33d33, #9f2b25); }
.button-icon { font-size: 15px; line-height: 1; }

.progress-card { border-radius: 14px; padding: 11px 12px; margin-bottom: 10px; }
.progress-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 7px; font-size: 10.5px; }
.progress-head strong { font-size: 11px; }
#progressPercent { color: var(--muted); font-variant-numeric: tabular-nums; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.progress-track { height: 7px; overflow: hidden; border-radius: 999px; margin-top: 9px; background: color-mix(in srgb, var(--muted) 18%, transparent); }
.progress-bar { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 180ms ease; }
.stats { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 9.5px; }

.status-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  align-items: start;
  border-radius: 13px;
  padding: 10px 11px;
}
.status-icon { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 900; }
#status { min-height: 18px; margin: 1px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.38; }

footer { display: flex; flex-direction: column; gap: 3px; padding: 9px 3px 0; color: var(--muted); font-size: 9.2px; line-height: 1.3; }
.support-line { opacity: .72; }

[hidden] { display: none !important; }
